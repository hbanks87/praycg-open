name: Attach verified public stimuli

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public Workbench release tag
        required: true
        default: PRAYCG_Workbench_Public_A11.9.2
        type: string

permissions:
  contents: read

concurrency:
  group: public-stimuli-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  attach-stimuli:
    if: >-
      github.repository == 'hbanks87/praycg-open' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.release.tag_name, 'PRAYCG_Workbench_Public_A'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Read maintained release helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check publication boundaries offline
        run: python3 -m unittest discover -s scripts/tests -p 'test_attach_public_stimuli.py' -v
      - name: Verify and attach the public stimulus assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROMPT_DISABLED: '1'
          TARGET_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python3 scripts/attach_public_stimuli.py --tag "$TARGET_TAG" --apply
